<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calificar Viaje - inDrive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .rating-box {
            background: var(--bg-surface);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            border: 1px solid var(--glass-border);
            text-align: center;
            margin-top: 1.5rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .star-rating {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 2.5rem;
            margin: 1.5rem 0;
        }

        .star-rating i {
            color: rgba(255,255,255,0.1);
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

        .star-rating i:hover, .star-rating i.active {
            color: var(--warning);
            transform: scale(1.15);
        }

        .tag-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 1.5rem 0;
        }

        .tag-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .tag-chip.selected {
            border-color: var(--primary);
            background: rgba(230, 81, 0, 0.08);
            color: var(--text-main);
        }

        .comment-area {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.9rem;
            resize: none;
            margin-bottom: 1.5rem;
            transition: border-color 0.3s;
        }

        .comment-area:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255,255,255,0.06);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- App Bar -->
        <div class="app-bar">
            <div style="width: 40px;"></div>
            <h1 class="app-bar-title">Calificar Viaje</h1>
            <div style="width: 40px;"></div>
        </div>

        <!-- Main Content -->
        <div class="app-content">
            <form th:action="@{/calificacion/guardar}" method="POST" id="ratingForm" class="rating-box" onsubmit="return handleSubmit(event)">
                <input type="hidden" name="viajeId" th:value="${viajeId}">
                <input type="hidden" name="puntuacion" id="puntuacionInput" value="0">

                <!-- Conductor Profile Card -->
                <div class="driver-profile-card" th:if="${conductor != null}" style="display: flex; flex-direction: column; align-items: center; margin-bottom: 1.5rem; background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); padding: 1.5rem; border-radius: 20px;">
                    <div class="driver-avatar" style="width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, var(--primary) 0%, #ff8f00 100%); display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; font-size: 1.8rem; margin-bottom: 0.8rem; box-shadow: 0 4px 15px rgba(255, 109, 0, 0.2);" th:text="${#strings.substring(conductor.usuario.nombres,0,1)}">C</div>
                    <h3 style="font-size: 1.15rem; font-weight: 600; margin-bottom: 4px;" th:text="${conductor.usuario.nombres + ' ' + conductor.usuario.apellidos}">Carlos Mendoza</h3>
                    <div style="font-size: 0.8rem; color: var(--warning); display: flex; align-items: center; gap: 4px; margin-bottom: 8px;">
                        <i class="fas fa-star"></i> 4.9 • Conductor verificado
                    </div>
                    <div style="font-size: 0.8rem; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 12px; border: 1px solid var(--glass-border);" th:if="${vehiculo != null}" th:text="${vehiculo.marca + ' ' + vehiculo.modelo + ' • ' + vehiculo.color + ' (' + vehiculo.placa + ')'}">Toyota Corolla • Blanco (ABC-123)</div>
                </div>

                <h2 class="mt-4" style="font-size: 1.3rem; font-weight: 600; margin-bottom: 8px;">¿Cómo estuvo tu viaje?</h2>
                <p class="text-muted" style="font-size:0.85rem; margin-bottom: 1.5rem;">Califica a tu conductor para mantener segura la comunidad.</p>

                <!-- Stars Component -->
                <div class="star-rating" id="starContainer">
                    <i class="fas fa-star" onclick="rate(1)"></i>
                    <i class="fas fa-star" onclick="rate(2)"></i>
                    <i class="fas fa-star" onclick="rate(3)"></i>
                    <i class="fas fa-star" onclick="rate(4)"></i>
                    <i class="fas fa-star" onclick="rate(5)"></i>
                </div>

                <div class="tag-grid">
                    <div class="tag-chip" type="button" onclick="toggleTag(this)">Excelente conductor</div>
                    <div class="tag-chip" type="button" onclick="toggleTag(this)">Vehículo limpio</div>
                    <div class="tag-chip" type="button" onclick="toggleTag(this)">Viaje seguro</div>
                    <div class="tag-chip" type="button" onclick="toggleTag(this)">Buena música</div>
                </div>

                <textarea class="comment-area" name="comentario" id="comment" rows="3" placeholder="Escribe un comentario opcional..."></textarea>

                <button type="submit" class="btn-primary" style="width:100%; border:none; cursor:pointer;">
                    Enviar Calificación
                </button>
            </form>
        </div>
    </div>

    <script>
        let currentRating = 0;

        function rate(val) {
            currentRating = val;
            const stars = document.querySelectorAll('#starContainer i');
            stars.forEach((star, idx) => {
                if (idx < val) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function toggleTag(el) {
            el.classList.toggle('selected');
        }

        function handleSubmit(e) {
            if (currentRating === 0) {
                alert("Por favor, selecciona una calificación (estrellas).");
                e.preventDefault();
                return false;
            }
            document.getElementById('puntuacionInput').value = currentRating;
            
            // Append selected tags to comments
            const selectedChips = document.querySelectorAll('.tag-chip.selected');
            const tags = Array.from(selectedChips).map(chip => chip.textContent).join(', ');
            const commentArea = document.getElementById('comment');
            if (tags.length > 0) {
                if (commentArea.value.trim() !== '') {
                    commentArea.value = commentArea.value + " (" + tags + ")";
                } else {
                    commentArea.value = tags;
                }
            }
            return true;
        }
    </script>
</body>
</html>
