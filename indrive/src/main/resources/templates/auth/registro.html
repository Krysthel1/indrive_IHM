<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro - inDrive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .auth-content {
            padding-top: 1rem;
            animation: slideUpFade 0.6s ease-out;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .role-selector {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 2rem;
            border: 1px solid var(--glass-border);
        }

        .role-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .role-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(230, 81, 0, 0.3);
        }

        .role-btn i {
            margin-right: 6px;
        }

        .conductor-fields {
            display: none;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid rgba(230, 81, 0, 0.2);
            margin-bottom: 1.5rem;
            animation: slideUpFade 0.4s ease-out;
        }

        .conductor-fields.show {
            display: block;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auth-links {
            text-align: center;
            margin-top: 2rem;
        }

        .auth-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .alert-danger {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            text-align: center;
            animation: slideUpFade 0.4s ease-out;
        }
        
        /* Hide original select */
        #rol { display: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-bar">
            <a href="/" class="app-bar-btn">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="app-bar-title">Crear Cuenta</h1>
            <div style="width: 40px;"></div>
        </div>

        <div class="app-content auth-content">
            <div class="auth-header">
                <h1>inDrive</h1>
                <p>Únete a nuestra comunidad</p>
            </div>

            <div class="alert-danger" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/auth/registro}" method="post">
                
                <!-- Custom Role Selector -->
                <div class="role-selector">
                    <div class="role-btn active" onclick="selectRole('PASAJERO')">
                        <i class="fas fa-user"></i> Pasajero
                    </div>
                    <div class="role-btn" onclick="selectRole('CONDUCTOR')">
                        <i class="fas fa-car"></i> Conductor
                    </div>
                </div>
                <select name="rol" id="rol">
                    <option value="PASAJERO" selected>Pasajero</option>
                    <option value="CONDUCTOR">Conductor</option>
                </select>

                <div class="input-group">
                    <label for="nombres">Nombres Completos</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="nombres" name="nombres" placeholder="Ej. Juan Pérez" required>
                    </div>
                </div>

                <!-- Note: The backend model expects apellidos too based on old form. We'll add it or combine. Old form had them separate. Let's keep separate but in one row if possible, or stacked. Stacked is better for mobile. -->
                <div class="input-group">
                    <label for="apellidos">Apellidos</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="apellidos" name="apellidos" placeholder="Tus apellidos" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="correo">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="correo" name="correo" placeholder="tu@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="telefono">Teléfono</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="telefono" name="telefono" placeholder="+51 999 999 999" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Conductor Fields -->
                <div id="datosConductor" class="conductor-fields">
                    <div class="section-title"><i class="fas fa-id-card"></i> Datos del Vehículo</div>
                    
                    <div class="input-group">
                        <label for="licencia">Número de Licencia</label>
                        <div class="input-wrapper">
                            <i class="fas fa-id-card"></i>
                            <input type="text" id="licencia" name="licencia" placeholder="H-12345678">
                        </div>
                    </div>

                    <div style="display:flex; gap: 10px;">
                        <div class="input-group" style="flex:1;">
                            <label for="marca">Marca</label>
                            <div class="input-wrapper">
                                <i class="fas fa-car-side"></i>
                                <input type="text" id="marca" name="marca" placeholder="Toyota">
                            </div>
                        </div>
                        <div class="input-group" style="flex:1;">
                            <label for="modelo">Modelo</label>
                            <div class="input-wrapper">
                                <i class="fas fa-car"></i>
                                <input type="text" id="modelo" name="modelo" placeholder="Corolla">
                            </div>
                        </div>
                    </div>

                    <div style="display:flex; gap: 10px;">
                        <div class="input-group" style="flex:1;">
                            <label for="placa">Placa</label>
                            <div class="input-wrapper">
                                <i class="fas fa-hashtag"></i>
                                <input type="text" id="placa" name="placa" placeholder="ABC-123">
                            </div>
                        </div>
                        <div class="input-group" style="flex:1;">
                            <label for="color">Color</label>
                            <div class="input-wrapper">
                                <i class="fas fa-palette"></i>
                                <input type="text" id="color" name="color" placeholder="Blanco">
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-primary mt-2">
                    Registrarme
                </button>
            </form>

            <div class="auth-links">
                <p>¿Ya tienes cuenta? <a href="/auth/login">Inicia Sesión</a></p>
            </div>
        </div>
    </div>

    <script>
        function selectRole(role) {
            // Update Select
            document.getElementById('rol').value = role;
            
            // Update UI buttons
            const btns = document.querySelectorAll('.role-btn');
            btns.forEach(btn => btn.classList.remove('active'));
            
            if(role === 'PASAJERO') {
                btns[0].classList.add('active');
                document.getElementById('datosConductor').classList.remove('show');
            } else {
                btns[1].classList.add('active');
                document.getElementById('datosConductor').classList.add('show');
            }
        }
    </script>
</body>
</html>
