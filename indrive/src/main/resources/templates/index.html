<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>inDrive - Tu Viaje</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .splash-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 3rem 2rem;
            background: radial-gradient(circle at 50% 30%, #BF360C 0%, var(--bg-dark) 70%);
            position: relative;
            overflow: hidden;
        }

        .splash-bg-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(230, 81, 0, 0.1);
            filter: blur(40px);
        }

        .circle-1 { width: 300px; height: 300px; top: -100px; left: -100px; }
        .circle-2 { width: 400px; height: 400px; bottom: 10%; right: -150px; background: rgba(255, 204, 128, 0.05); }

        .splash-content {
            z-index: 1;
            text-align: center;
            margin-top: 20vh;
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app-logo {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FFFFFF 0%, #ffcc80 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
            margin-bottom: 1rem;
        }

        .app-tagline {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        .splash-actions {
            z-index: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            animation: slideUpFade 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
            opacity: 0;
        }

        .btn-outline {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 14px;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: border-color 0.3s, background-color 0.3s;
        }

        .btn-outline:active {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="splash-container">
            <div class="splash-bg-elements">
                <div class="floating-circle circle-1"></div>
                <div class="floating-circle circle-2"></div>
            </div>

            <div class="splash-content">
                <div class="app-logo">inDrive</div>
                <p class="app-tagline">Tu Viaje, Tu Precio</p>
            </div>

            <div class="splash-actions">
                <a href="/auth/registro" class="btn-primary">
                    Crear Cuenta
                </a>
                <a href="/auth/login" class="btn-outline">
                    Iniciar Sesión
                </a>
            </div>
        </div>
    </div>
</body>
</html>
