<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enviar Oferta - inDrive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .offer-container {
            background: var(--bg-surface);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            border: 1px solid var(--glass-border);
            margin-top: 1.5rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            animation: slideUpFade 0.5s ease-out;
        }

        .route-summary {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }

        .route-point {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .route-point:last-child { margin-bottom: 0; }

        .price-suggestions-grid {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        .suggest-btn {
            flex: 1;
            background: rgba(230, 81, 0, 0.1);
            border: 1px solid rgba(230, 81, 0, 0.3);
            color: var(--primary);
            padding: 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .suggest-btn:active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .input-group label {
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .input-wrapper input {
            padding: 12px 16px 12px 40px !important;
            border-radius: 12px !important;
        }
        
        .input-wrapper i {
            left: 14px !important;
            font-size: 1.1rem !important;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- App Bar -->
        <div class="app-bar">
            <a href="/conductor/solicitudes" class="app-bar-btn">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="app-bar-title">Enviar Oferta</h1>
            <div style="width: 40px;"></div>
        </div>

        <!-- Main Content -->
        <div class="app-content">
            <div class="offer-container">
                <h3 style="font-size: 1.1rem; margin-bottom: 10px; color: white;">Detalles del viaje</h3>
                
                <div class="route-summary">
                    <div class="route-point">
                        <i class="fas fa-dot-circle" style="color:var(--info);"></i>
                        <span th:text="${viaje.origen}">Origen</span>
                    </div>
                    <div class="route-point">
                        <i class="fas fa-map-marker-alt" style="color:var(--primary);"></i>
                        <span th:text="${viaje.destino}">Destino</span>
                    </div>
                </div>

                <div style="display:flex; justify-content:space-between; margin-bottom: 1.5rem; font-size:0.9rem;">
                    <span style="color:var(--text-muted);">Ofrecido por pasajero:</span>
                    <strong style="color:var(--success);">S/ <span th:text="${viaje.precioPropuesto}">10.00</span></strong>
                </div>

                <form action="/oferta/guardar" method="post">
                    <input type="hidden" name="viajeId" th:value="${viaje.idViaje}">
                    <input type="hidden" name="conductorId" th:value="${conductorId}">

                    <!-- Suggestions buttons -->
                    <label style="display:block; margin-bottom: 8px; font-size: 0.8rem; color:var(--text-muted);">Sugerencias rápidas:</label>
                    <div class="price-suggestions-grid">
                        <button type="button" class="suggest-btn" th:data-price="${viaje.precioPropuesto}" onclick="setPrice(parseFloat(this.getAttribute('data-price')))">
                            S/ <span th:text="${viaje.precioPropuesto}">10</span>
                        </button>
                        <button type="button" class="suggest-btn" th:data-price="${viaje.precioPropuesto + 1}" onclick="setPrice(parseFloat(this.getAttribute('data-price')))">
                            + S/ 1
                        </button>
                        <button type="button" class="suggest-btn" th:data-price="${viaje.precioPropuesto + 2}" onclick="setPrice(parseFloat(this.getAttribute('data-price')))">
                            + S/ 2
                        </button>
                        <button type="button" class="suggest-btn" th:data-price="${viaje.precioPropuesto + 5}" onclick="setPrice(parseFloat(this.getAttribute('data-price')))">
                            + S/ 5
                        </button>
                    </div>

                    <div class="input-group">
                        <label for="precio">Tu Oferta (S/)</label>
                        <div class="input-wrapper">
                            <i class="fas fa-hand-holding-usd"></i>
                            <input type="number" id="precio" name="precio" placeholder="0.00" th:value="${viaje.precioPropuesto}" step="0.5" required>
                        </div>
                    </div>

                    <div class="input-group" style="margin-bottom: 2rem;">
                        <label for="tiempoLlegada">Tiempo estimado de llegada (minutos)</label>
                        <div class="input-wrapper">
                            <i class="fas fa-clock"></i>
                            <input type="number" id="tiempoLlegada" name="tiempoLlegada" placeholder="Ej. 5" value="5" min="1" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">
                        <i class="fas fa-paper-plane"></i> Enviar Oferta
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function setPrice(val) {
            document.getElementById('precio').value = val.toFixed(2);
        }
    </script>
</body>
</html>
