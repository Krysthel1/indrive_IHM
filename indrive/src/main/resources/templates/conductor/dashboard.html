<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conductor - inDrive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .driver-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid var(--success);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
        }

        .status-text {
            font-weight: 600;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-text i {
            font-size: 1.2rem;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.2);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--success);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .earnings-card {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            border-radius: 20px;
            padding: 1.5rem;
            color: white;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 25px rgba(33, 150, 243, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .earnings-amount {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .earnings-label {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .quick-actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .action-card {
            background: var(--bg-surface);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.2rem;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s;
        }

        .action-card:active {
            transform: scale(0.95);
        }

        .action-card i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .action-card span {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .action-card.requests i { color: var(--primary); }
        .action-card.history i { color: var(--warning); }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- App Bar -->
        <div class="app-bar">
            <h1 class="app-bar-title">inDrive Conductor</h1>
            <a href="/auth/logout" class="app-bar-btn" title="Cerrar Sesión">
                <i class="fas fa-sign-out-alt" style="color: var(--danger);"></i>
            </a>
        </div>

        <!-- Main Content -->
        <div class="app-content animate-slide-up">
            <h2 class="mb-1" style="font-size: 1.5rem;">Hola, <span th:text="${usuarioLogueado.nombres}">Conductor</span></h2>
            <p class="text-muted mb-3">Listo para tu próximo viaje</p>

            <div class="driver-status" id="statusContainer" th:style="${conductor.disponibilidad} ? 'background: rgba(76, 175, 80, 0.1); border-color: var(--success);' : 'background: rgba(255, 255, 255, 0.03); border-color: var(--glass-border);'">
                <div class="status-text" id="statusText" th:style="${conductor.disponibilidad} ? 'color: var(--success);' : 'color: var(--text-muted);'">
                    <i class="fas fa-signal"></i> <span th:text="${conductor.disponibilidad} ? 'Disponible' : 'No disponible'">Disponible</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="statusToggle" th:checked="${conductor.disponibilidad}" onchange="toggleAvailability()">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="earnings-card">
                <div>
                    <div class="earnings-label">Ganancias Hoy</div>
                    <div class="earnings-amount">S/ <span th:text="${gananciasHoy}">0.00</span></div>
                </div>
                <i class="fas fa-wallet" style="font-size: 3rem; opacity: 0.5;"></i>
            </div>

            <a href="/conductor/solicitudes" class="btn-primary mb-4" style="background: var(--success);">
                <i class="fas fa-bell"></i> Ver Solicitudes
            </a>

            <div class="quick-actions-grid">
                <a href="/conductor/viaje" class="action-card requests">
                    <i class="fas fa-route"></i>
                    <span>Viaje Actual</span>
                </a>
                <a href="/conductor/historial" class="action-card history">
                    <i class="fas fa-history"></i>
                    <span>Historial</span>
                </a>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="/conductor/dashboard" class="nav-item active">
                <i class="fas fa-home"></i>
                <span>Inicio</span>
            </a>
            <a href="/conductor/solicitudes" class="nav-item">
                <i class="fas fa-list"></i>
                <span>Solicitudes</span>
            </a>
            <a href="/conductor/ganancias" class="nav-item">
                <i class="fas fa-chart-line"></i>
                <span>Ganancias</span>
            </a>
            <a href="/conductor/perfil" class="nav-item">
                <i class="fas fa-user"></i>
                <span>Perfil</span>
            </a>
        </nav>
    </div>

    <script>
        function toggleAvailability() {
            fetch('/conductor/api/toggle-disponibilidad', {
                method: 'POST'
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const statusText = document.getElementById('statusText');
                    const statusContainer = document.getElementById('statusContainer');
                    const isDisp = data.disponibilidad;
                    
                    if (isDisp) {
                        statusText.style.color = 'var(--success)';
                        statusText.innerHTML = '<i class="fas fa-signal"></i> Disponible';
                        statusContainer.style.background = 'rgba(76, 175, 80, 0.1)';
                        statusContainer.style.borderColor = 'var(--success)';
                    } else {
                        statusText.style.color = 'var(--text-muted)';
                        statusText.innerHTML = '<i class="fas fa-signal-slash"></i> No disponible';
                        statusContainer.style.background = 'rgba(255, 255, 255, 0.03)';
                        statusContainer.style.borderColor = 'var(--glass-border)';
                    }
                }
            })
            .catch(err => console.error("Error toggling availability: ", err));
        }

        function checkActiveTrip() {
            fetch('/viaje/api/estado')
                .then(res => res.json())
                .then(data => {
                    if (data.estado === 'ACEPTADO' || data.estado === 'EN_CURSO') {
                        window.location.href = '/conductor/viaje';
                    }
                })
                .catch(err => console.error("Error checking active trip: ", err));
        }
        setInterval(checkActiveTrip, 3000);
        checkActiveTrip();
    </script>
</body>
</html>
