<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viaje Actual - inDrive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .map-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0;
        }

        .map-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(180deg, rgba(18, 18, 18, 0.2) 0%, rgba(18, 18, 18, 0.7) 40%, rgba(18, 18, 18, 1) 90%);
            z-index: 1;
            pointer-events: none;
        }

        .app-bar {
            background: transparent;
            border-bottom: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg-surface);
            border-radius: 30px 30px 0 0;
            padding: 1.5rem;
            z-index: 2;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-bottom: none;
        }

        .sheet-handle {
            width: 40px;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            margin: 0 auto 1rem auto;
        }

        .status-badge-custom {
            display: inline-block;
            background: rgba(76, 175, 80, 0.15);
            color: var(--success);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .client-info-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            padding: 1rem 1.2rem;
            border-radius: 16px;
            margin-bottom: 1.2rem;
        }

        .client-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .client-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--info) 0%, #1976D2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 1.1rem;
        }

        .client-text {
            display: flex;
            flex-direction: column;
        }

        .client-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .client-rating {
            font-size: 0.75rem;
            color: var(--warning);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .price-display {
            text-align: right;
        }

        .price-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--success);
        }

        .route-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .route-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-action-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-action {
            width: 100%;
            border-radius: 14px;
            padding: 1rem;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-start {
            background: var(--primary-gradient);
            color: white;
        }

        .btn-end {
            background: var(--success);
            color: white;
        }

        .btn-cancel {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }
    </style>
</head>

<body>
    <div class="app-container" style="padding-bottom: 0;">
        <div class="map-bg">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3972.1963283296216!2d-80.629471!3d-5.180252!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x904a107ef4f9547d%3A0x9d4e5f72cfb0132b!2sUniversidad%20Nacional%20de%20Piura!5e0!3m2!1ses-419!2spe!4v1700000000000!5m2!1ses-419!2spe"
                width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <div class="map-overlay"></div>

        <!-- App Bar -->
        <div class="app-bar" style="z-index: 10;">
            <div style="width: 40px;"></div>
            <h1 class="app-bar-title" style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Viaje Activo</h1>
            <div style="width: 40px;"></div>
        </div>

        <!-- Bottom Sheet -->
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>

            <div class="status-badge-custom" id="stateBadge"
                th:text="${viaje.estado == 'ACEPTADO' ? 'Conductor Asignado' : 'Viaje en Curso'}">
                Conductor Asignado
            </div>

            <!-- Client Info Box -->
            <div class="client-info-box">
                <div class="client-details">
                    <div class="client-avatar" th:text="${#strings.substring(pasajeroUsuario.nombres,0,1)}">M</div>
                    <div class="client-text">
                        <span class="client-name"
                            th:text="${pasajeroUsuario.nombres + ' ' + pasajeroUsuario.apellidos}">María López</span>
                        <span class="client-rating"><i class="fas fa-star"></i> 5.0 • Pasajero</span>
                    </div>
                </div>
                <div class="price-display">
                    <div class="price-value">S/ <span th:text="${viaje.precioPropuesto}">12.00</span></div>
                </div>
            </div>

            <!-- Route Info -->
            <div class="route-info">
                <div class="route-item">
                    <i class="fas fa-circle" style="color: var(--info); font-size: 0.8rem;"></i>
                    <span><strong>Origen:</strong> <span th:text="${viaje.origen}">Origen</span></span>
                </div>
                <div class="route-item">
                    <i class="fas fa-map-marker-alt" style="color: var(--primary); font-size: 0.8rem;"></i>
                    <span><strong>Destino:</strong> <span th:text="${viaje.destino}">Destino</span></span>
                </div>
            </div>

            <!-- Actions container -->
            <div class="btn-action-container">
                <button th:if="${viaje.estado == 'ACEPTADO'}" id="btnStart" class="btn-action btn-start"
                    onclick="updateState('EN_CURSO')">
                    <i class="fas fa-play"></i> Iniciar Viaje
                </button>

                <button th:style="${viaje.estado == 'EN_CURSO'} ? '' : 'display:none;'" id="btnEnd"
                    class="btn-action btn-end" onclick="updateState('COMPLETADO')">
                    <i class="fas fa-flag-checkered"></i> Finalizar Viaje
                </button>

                <button id="btnCancel" class="btn-action btn-cancel" onclick="cancelTrip()">
                    Cancelar Viaje
                </button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const viajeId = [[${ viaje.idViaje }]];

        function updateState(newState) {
            const formData = new FormData();
            formData.append('viajeId', viajeId);
            formData.append('nuevoEstado', newState);

            fetch('/viaje/api/cambiar-estado', {
                method: 'POST',
                body: formData
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        if (newState === 'EN_CURSO') {
                            document.getElementById('stateBadge').innerText = "Viaje en Curso";
                            document.getElementById('btnStart').style.display = 'none';
                            document.getElementById('btnEnd').style.display = 'flex';
                        } else if (newState === 'COMPLETADO') {
                            // Redirect to history/earnings
                            window.location.href = '/conductor/dashboard';
                        }
                    } else {
                        alert("No se pudo actualizar el estado.");
                    }
                })
                .catch(err => console.error("Error updating trip status: ", err));
        }

        function cancelTrip() {
            if (confirm("¿Estás seguro de cancelar este viaje?")) {
                updateState('CANCELADO');
            }
        }
    </script>
</body>

</html>
