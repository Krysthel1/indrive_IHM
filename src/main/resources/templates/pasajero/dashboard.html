<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pasajero - inDrive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #E65100 0%, #BF360C 50%, #8B2500 100%);
            opacity: 0.05;
            z-index: 0;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 1rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0,0,0,0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar-brand {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #E65100 0%, #BF360C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }
        .btn-logout {
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        .btn-logout:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
            position: relative;
            z-index: 1;
        }
        .welcome-section {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 4rem;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
            animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 3rem;
            border: 1px solid rgba(255,255,255,0.2);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .welcome-section h1 {
            font-size: 3rem;
            color: #333;
            margin-bottom: 1rem;
            font-weight: 800;
        }
        .welcome-section p {
            color: #666;
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
            font-weight: 500;
        }
        .btn-ride {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            padding: 1.5rem 4rem;
            background: linear-gradient(135deg, #E65100 0%, #BF360C 100%);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            box-shadow: 0 15px 40px rgba(230, 81, 0, 0.4);
            position: relative;
            overflow: hidden;
        }
        .btn-ride::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        .btn-ride:hover::before {
            left: 100%;
        }
        .btn-ride:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(230, 81, 0, 0.5);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        .stat-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: fadeIn 0.6s ease-out;
        }
        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stat-card:hover {
            transform: translateY(-8px) scale(1.05);
            background: rgba(255,255,255,0.15);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .stat-card i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #ffcc80;
        }
        .stat-card .number {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .stat-card .label {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 500;
        }
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        .action-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeIn 0.6s ease-out;
        }
        .action-card:nth-child(1) { animation-delay: 0.4s; }
        .action-card:nth-child(2) { animation-delay: 0.5s; }
        .action-card:nth-child(3) { animation-delay: 0.6s; }
        .action-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 25px 70px rgba(0,0,0,0.25);
        }
        .action-card i {
            font-size: 3rem;
            color: #E65100;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }
        .action-card:hover i {
            transform: scale(1.2);
            color: #BF360C;
        }
        .action-card h3 {
            color: #333;
            margin-bottom: 0.8rem;
            font-size: 1.3rem;
            font-weight: 700;
        }
        .action-card p {
            color: #666;
            font-size: 1rem;
            font-weight: 500;
        }
        @media (max-width: 768px) {
            .navbar {
                padding: 1rem 1.5rem;
            }
            .navbar-brand {
                font-size: 1.5rem;
            }
            .welcome-section {
                padding: 2.5rem;
            }
            .welcome-section h1 {
                font-size: 2rem;
            }
            .btn-ride {
                padding: 1.2rem 2.5rem;
                font-size: 1rem;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .quick-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <span class="navbar-brand">inDrive</span>
        <a href="/auth/login" class="btn-logout">
            <i class="fas fa-sign-out-alt"></i> Salir
        </a>
    </nav>

    <div class="container">
        <div class="welcome-section">
            <h1>¿A dónde vamos hoy?</h1>
            <p>Solicita un viaje en segundos con los mejores conductores</p>
            <a href="/pasajero/destino" class="btn-ride">
                <i class="fas fa-car"></i> Pedir un Viaje
            </a>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-route"></i>
                <div class="number">0</div>
                <div class="label">Viajes Totales</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-star"></i>
                <div class="number">0</div>
                <div class="label">Calificación</div>
            </div>
            <div class="stat-card">
                <i class="fas fa-clock"></i>
                <div class="number">0</div>
                <div class="label">Horas de Viaje</div>
            </div>
        </div>

        <div class="quick-actions">
            <a href="/pasajero/historial" class="action-card">
                <i class="fas fa-history"></i>
                <h3>Historial</h3>
                <p>Ver tus viajes anteriores</p>
            </a>
            <a href="/pasajero/calificacion" class="action-card">
                <i class="fas fa-star"></i>
                <h3>Calificaciones</h3>
                <p>Ver tus calificaciones</p>
            </a>
            <a href="/pasajero/pago" class="action-card">
                <i class="fas fa-credit-card"></i>
                <h3>Métodos de Pago</h3>
                <p>Gestiona tus pagos</p>
            </a>
        </div>
    </div>
</body>
</html>
