<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viaje en Curso - inDrive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .map-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0;
        }

        .map-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(180deg, rgba(247,249,252,0.1) 0%, rgba(247,249,252,0.7) 40%, rgba(247,249,252,1) 90%);
            z-index: 1;
            pointer-events: none;
        }

        .app-bar {
            background: transparent;
            border-bottom: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg-surface);
            border-radius: 30px 30px 0 0;
            padding: 1.5rem;
            z-index: 2;
            box-shadow: 0 -10px 40px rgba(160,175,190,0.12);
            border: 1px solid var(--glass-border);
            border-bottom: none;
        }

        .sheet-handle {
            width: 40px;
            height: 5px;
            background: rgba(0,0,0,0.1);
            border-radius: 5px;
            margin: 0 auto 1rem auto;
        }

        .status-tracker {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(52, 199, 89, 0.15);
            border: 1px solid var(--success);
            padding: 0.8rem 1.2rem;
            border-radius: 14px;
            margin-bottom: 1.2rem;
            color: #278A3E;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(52, 199, 89, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
        }

        .driver-info-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #FFFFFF;
            border: 1px solid #EEF2F6;
            padding: 1.2rem;
            border-radius: 16px;
            margin-bottom: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.01);
        }

        .driver-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .driver-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, #ff8f00 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 1.2rem;
        }

        .driver-text {
            display: flex;
            flex-direction: column;
        }

        .driver-name {
            font-weight: 600;
            font-size: 1rem;
            color: #1A1A1A;
        }

        .driver-rating {
            font-size: 0.8rem;
            color: var(--warning);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .price-display {
            text-align: right;
        }

        .price-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--success);
        }

        .price-label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .trip-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 0.85rem;
            color: #4C5E70;
            margin-bottom: 1.5rem;
            background: #F4F6F9;
            border-radius: 12px;
            padding: 1rem;
            border: 1px solid #EEF2F6;
        }

        .trip-detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="app-container" style="padding-bottom: 0;">
        <div class="map-bg">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3972.1963283296216!2d-80.629471!3d-5.180252!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x904a107ef4f9547d%3A0x9d4e5f72cfb0132b!2sUniversidad%20Nacional%20de%20Piura!5e0!3m2!1ses-419!2spe!4v1700000000000!5m2!1ses-419!2spe" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <div class="map-overlay"></div>

        <!-- App Bar -->
        <div class="app-bar" style="z-index: 10;">
            <div style="width: 40px;"></div>
            <h1 class="app-bar-title" style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Viaje en Curso</h1>
            <div style="width: 40px;"></div>
        </div>

        <!-- Bottom Sheet -->
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>

            <!-- Status Tracker -->
            <div class="status-tracker">
                <span style="font-weight:600; font-size:0.9rem;" id="statusText">Conductor en camino</span>
                <span class="status-dot"></span>
            </div>

            <!-- Driver Info Box -->
            <div class="driver-info-box">
                <div class="driver-details">
                    <div class="driver-avatar" th:text="${#strings.substring(conductor.usuario.nombres,0,1)}">C</div>
                    <div class="driver-text">
                        <span class="driver-name" th:text="${conductor.usuario.nombres + ' ' + conductor.usuario.apellidos}">Carlos Mendoza</span>
                        <span class="driver-rating"><i class="fas fa-star"></i> 4.9 • Conductor verificado</span>
                    </div>
                </div>
                <div class="price-display">
                    <div class="price-value">S/ <span th:text="${viaje.precioPropuesto}">12.00</span></div>
                    <div class="price-label">Tarifa acordada</div>
                </div>
            </div>

            <!-- Trip details -->
            <div class="trip-details">
                <div class="trip-detail-item">
                    <i class="fas fa-dot-circle" style="color:var(--info);"></i>
                    <span><strong>Origen:</strong> <span th:text="${viaje.origen}">Origen</span></span>
                </div>
                <div class="trip-detail-item">
                    <i class="fas fa-map-marker-alt" style="color:var(--primary);"></i>
                    <span><strong>Destino:</strong> <span th:text="${viaje.destino}">Destino</span></span>
                </div>
            </div>

            <!-- Manual redirect just in case -->
            <a href="/pasajero/pago" class="btn-primary" style="background:var(--primary-gradient);">
                Detalles de Pago
            </a>
        </div>
    </div>

    <script th:inline="javascript">
        const viajeId = [[${viaje.idViaje}]];

        function checkTripStatus() {
            fetch('/viaje/api/estado')
                .then(res => res.json())
                .then(data => {
                    const statusText = document.getElementById('statusText');
                    
                    if (data.estado === 'ACEPTADO') {
                        statusText.innerText = "Conductor en camino";
                    } else if (data.estado === 'EN_CURSO') {
                        statusText.innerText = "Viaje iniciado • En ruta";
                    } else if (data.estado === 'COMPLETADO') {
                        // Trip is finished by the driver, go to payment automatically!
                        window.location.href = '/pasajero/pago';
                    }
                })
                .catch(err => console.error("Error checking trip status: ", err));
        }

        // Poll every 3 seconds
        setInterval(checkTripStatus, 3000);
        checkTripStatus();
    </script>
</body>
</html>
