<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buscando Conductor - inDrive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .map-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0;
        }

        .map-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(180deg, rgba(247,249,252,0.1) 0%, rgba(247,249,252,0.7) 40%, rgba(247,249,252,1) 90%);
            z-index: 1;
            pointer-events: none;
        }

        .app-bar {
            background: transparent;
            border-bottom: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }

        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            max-height: 70vh;
            background: var(--bg-surface);
            border-radius: 30px 30px 0 0;
            padding: 1.5rem;
            z-index: 2;
            box-shadow: 0 -10px 40px rgba(160,175,190,0.12);
            border: 1px solid var(--glass-border);
            border-bottom: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sheet-handle {
            width: 40px;
            height: 5px;
            background: rgba(0,0,0,0.1);
            border-radius: 5px;
            margin: 0 auto 1rem auto;
            flex-shrink: 0;
        }

        .offers-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 1rem;
            padding-bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Pulsing Radar UI */
        .radar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            text-align: center;
        }

        .radar-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 85, 0, 0.08);
            border: 2px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 1.5rem;
            animation: pulse-radar 2s infinite;
        }

        @keyframes pulse-radar {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 85, 0, 0.4);
            }
            70% {
                box-shadow: 0 0 0 30px rgba(255, 85, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 85, 0, 0);
            }
        }

        .radar-ring i {
            font-size: 2rem;
            color: var(--primary);
        }

        .driver-card {
            background: #FFFFFF;
            border: 1px solid #EEF2F6;
            border-radius: 20px;
            padding: 1.2rem;
            animation: slideUpFade 0.4s ease-out;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.01);
        }

        .driver-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .driver-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .driver-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, #ff8f00 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 1.1rem;
        }

        .driver-name-rating {
            display: flex;
            flex-direction: column;
        }

        .driver-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .driver-rating {
            font-size: 0.8rem;
            color: var(--warning);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .price-badge {
            background: rgba(52, 199, 89, 0.15);
            color: var(--success);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .driver-vehicle {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            border-top: 1px solid #EEF2F6;
            padding-top: 0.8rem;
        }

        .offer-actions {
            display: flex;
            gap: 10px;
        }

        .btn-ignore {
            background: #F4F6F9;
            border: 1px solid #EEF2F6;
            color: #4C5E70;
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-accept {
            flex: 1;
            background: var(--success);
            border: none;
            color: white;
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn-accept:hover {
            background: #30B650;
        }
    </style>
</head>
<body>
    <div class="app-container" style="padding-bottom: 0;">
        <div class="map-bg">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3972.1963283296216!2d-80.629471!3d-5.180252!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x904a107ef4f9547d%3A0x9d4e5f72cfb0132b!2sUniversidad%20Nacional%20de%20Piura!5e0!3m2!1ses-419!2spe!4v1700000000000!5m2!1ses-419!2spe" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <div class="map-overlay"></div>

        <!-- App Bar -->
        <div class="app-bar" style="z-index: 10;">
            <a href="javascript:void(0)" onclick="cancelRequest()" class="app-bar-btn" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);">
                <i class="fas fa-times"></i>
            </a>
            <h1 class="app-bar-title" style="text-shadow: 0 2px 4px rgba(0,0,0,0.5);">Buscando Conductor</h1>
            <div style="width: 40px;"></div>
        </div>

        <!-- Bottom Sheet -->
        <div class="bottom-sheet">
            <div class="sheet-handle"></div>

            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.05); padding-bottom: 0.8rem;">
                <div>
                    <h3 style="font-size:1.1rem; margin:0;" th:text="${viaje.destino}">Destino</h3>
                    <p style="font-size:0.8rem; color:var(--text-muted); margin:0;">Tarifa propuesta: <strong style="color:var(--primary);">S/ <span th:text="${viaje.precioPropuesto}">10.00</span></strong></p>
                </div>
                <div class="badge badge-primary">Buscando</div>
            </div>

            <!-- Offers or Radar -->
            <div class="offers-list" id="offersList">
                <div class="radar-container" id="radarPlaceholder">
                    <div class="radar-ring">
                        <i class="fas fa-search-location"></i>
                    </div>
                    <h4 style="font-size:1rem; margin-bottom: 6px;">Esperando ofertas...</h4>
                    <p style="font-size:0.8rem; color:var(--text-muted); margin:0;">Los conductores cercanos verán tu solicitud en breve.</p>
                </div>
            </div>

            <!-- Cancel Button at bottom -->
            <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.05); width: 100%;">
                <button class="btn-primary" style="background: rgba(255, 82, 82, 0.1); border: 1px solid var(--danger); color: var(--danger); box-shadow: none; width: 100%;" onclick="cancelRequest()">
                    <i class="fas fa-times-circle"></i> Cancelar Solicitud
                </button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const viajeId = [[${viaje.idViaje}]];

        function fetchOffers() {
            fetch('/viaje/api/ofertas')
                .then(response => response.json())
                .then(offers => {
                    const listElement = document.getElementById('offersList');
                    const radar = document.getElementById('radarPlaceholder');
                    
                    if (offers.length === 0) {
                        if (!radar) {
                            listElement.innerHTML = `
                                <div class="radar-container" id="radarPlaceholder">
                                    <div class="radar-ring">
                                        <i class="fas fa-search-location"></i>
                                    </div>
                                    <h4 style="font-size:1rem; margin-bottom: 6px;">Esperando ofertas...</h4>
                                    <p style="font-size:0.8rem; color:var(--text-muted); margin:0;">Los conductores cercanos verán tu solicitud en breve.</p>
                                </div>
                            `;
                        }
                        return;
                    }

                    // Clear and render offers
                    let html = '';
                    offers.forEach(o => {
                        const firstLetter = o.nombreConductor.charAt(0);
                        html += `
                            <div class="driver-card">
                                <div class="driver-header">
                                    <div class="driver-details">
                                        <div class="driver-avatar">${firstLetter}</div>
                                        <div class="driver-name-rating">
                                            <span class="driver-name">${o.nombreConductor}</span>
                                            <span class="driver-rating">
                                                <i class="fas fa-star"></i> 4.9 • Llega en ${o.tiempoLlegada} min
                                            </span>
                                        </div>
                                    </div>
                                    <div class="price-badge">
                                        S/ ${o.precio.toFixed(2)}
                                    </div>
                                </div>
                                <div class="driver-vehicle">
                                    <i class="fas fa-car"></i>
                                    <span>${o.vehiculo}</span>
                                </div>
                                <div class="offer-actions">
                                    <button class="btn-ignore" onclick="ignoreOffer(this)">Ignorar</button>
                                    <button class="btn-accept" onclick="acceptOffer(${o.conductorId}, ${o.precio})">Aceptar Oferta</button>
                                </div>
                            </div>
                        `;
                    });
                    listElement.innerHTML = html;
                })
                .catch(err => console.error("Error fetching offers: ", err));
        }

        function acceptOffer(conductorId, precio) {
            const formData = new FormData();
            formData.append('viajeId', viajeId);
            formData.append('conductorId', conductorId);
            formData.append('precio', precio);

            fetch('/viaje/api/aceptar-oferta', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/pasajero/seguimiento';
                } else {
                    alert("No se pudo aceptar la oferta. Intente de nuevo.");
                }
            })
            .catch(err => console.error("Error accepting offer: ", err));
        }

        function ignoreOffer(btn) {
            const card = btn.closest('.driver-card');
            card.style.opacity = '0.3';
            card.style.pointerEvents = 'none';
            setTimeout(() => card.remove(), 400);
        }

        function cancelRequest() {
            const formData = new FormData();
            formData.append('viajeId', viajeId);
            fetch('/viaje/api/cancelar', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                window.location.href = '/pasajero/dashboard';
            })
            .catch(err => {
                console.error("Error cancelling: ", err);
                window.location.href = '/pasajero/dashboard';
            });
        }

        // Poll every 3 seconds
        setInterval(fetchOffers, 3000);
        fetchOffers();
    </script>
</body>
</html>
