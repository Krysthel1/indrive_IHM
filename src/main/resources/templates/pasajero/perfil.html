<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perfil - inDrive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid #EEF2F6;
            margin-bottom: 1.5rem;
            animation: slideUpFade 0.5s ease-out;
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            box-shadow: 0 8px 20px rgba(255, 85, 0, 0.25);
            margin-bottom: 1rem;
        }

        .profile-name {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #1A1A1A;
        }

        .profile-role-badge {
            background: rgba(255, 85, 0, 0.12);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .profile-details-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 2rem;
            animation: slideUpFade 0.5s ease-out 0.1s forwards;
            opacity: 0;
        }

        .profile-detail-card {
            background: #FFFFFF;
            border: 1px solid #EEF2F6;
            border-radius: 16px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.01);
        }

        .profile-detail-card i {
            font-size: 1.25rem;
            color: var(--primary);
            width: 24px;
            text-align: center;
        }

        .detail-info {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .detail-value {
            font-size: 0.95rem;
            font-weight: 500;
            color: #1A1A1A;
        }

        .logout-btn-wrapper {
            animation: slideUpFade 0.5s ease-out 0.2s forwards;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- App Bar -->
        <div class="app-bar">
            <h1 class="app-bar-title">Mi Perfil</h1>
            <div style="width: 40px;"></div>
        </div>

        <!-- Main Content -->
        <div class="app-content">
            <div class="profile-header">
                <div class="profile-avatar" th:text="${#strings.substring(usuarioLogueado.nombres,0,1)}">P</div>
                <div class="profile-name" th:text="${usuarioLogueado.nombres + ' ' + usuarioLogueado.apellidos}">Nombre Pasajero</div>
                <span class="profile-role-badge">Pasajero</span>
            </div>

            <div class="profile-details-list">
                <div class="profile-detail-card">
                    <i class="fas fa-envelope"></i>
                    <div class="detail-info">
                        <span class="detail-label">Correo Electrónico</span>
                        <span class="detail-value" th:text="${usuarioLogueado.correo}">pasajero@indrive.com</span>
                    </div>
                </div>

                <div class="profile-detail-card">
                    <i class="fas fa-phone"></i>
                    <div class="detail-info">
                        <span class="detail-label">Número de Teléfono</span>
                        <span class="detail-value" th:text="${usuarioLogueado.telefono}">+51 987654321</span>
                    </div>
                </div>

                <div class="profile-detail-card">
                    <i class="fas fa-star"></i>
                    <div class="detail-info">
                        <span class="detail-label">Calificación de Pasajero</span>
                        <span class="detail-value">5.0 ⭐ (Verificado)</span>
                    </div>
                </div>
            </div>

            <div class="logout-btn-wrapper">
                <a href="/auth/logout" class="btn-primary" style="background: rgba(255, 82, 82, 0.1); border: 1px solid var(--danger); color: var(--danger); box-shadow: none;">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </a>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="/pasajero/dashboard" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Inicio</span>
            </a>
            <a href="/pasajero/historial" class="nav-item">
                <i class="fas fa-car"></i>
                <span>Viajes</span>
            </a>
            <a href="/pasajero/pago" class="nav-item">
                <i class="fas fa-credit-card"></i>
                <span>Billetera</span>
            </a>
            <a href="/pasajero/perfil" class="nav-item active">
                <i class="fas fa-user"></i>
                <span>Perfil</span>
            </a>
        </nav>
    </div>
</body>
</html>
