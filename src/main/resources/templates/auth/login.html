<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iniciar Sesión - inDrive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .auth-content {
            padding-top: 2rem;
            animation: slideUpFade 0.6s ease-out;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .alert-danger {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            text-align: center;
        }

        .auth-links {
            text-align: center;
            margin-top: 2rem;
        }

        .auth-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-bar">
            <a href="/" class="app-bar-btn">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="app-bar-title">Iniciar Sesión</h1>
            <div style="width: 40px;"></div> <!-- Spacer for centering -->
        </div>

        <div class="app-content auth-content">
            <div class="auth-header">
                <h1 style="font-size: 3rem; font-weight: 800; letter-spacing: -2px;"><span style="color: #1A1A1A;">in</span><span style="color: var(--primary);">Drive</span></h1>
                <p>Bienvenido de nuevo</p>
            </div>

            <div class="alert-danger" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/auth/login}" method="post">
                <div class="input-group">
                    <label for="correo">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="correo" name="correo" placeholder="tu@email.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary mt-4">
                    Iniciar Sesión
                </button>
            </form>

            <div class="auth-links">
                <p class="mb-2"><a href="#">¿Olvidaste tu contraseña?</a></p>
                <p>¿No tienes cuenta? <a href="/auth/registro">Regístrate</a></p>
            </div>
        </div>
    </div>
</body>
</html>
