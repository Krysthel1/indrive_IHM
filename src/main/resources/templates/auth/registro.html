<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - inDrive</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #E65100 0%, #BF360C 50%, #8B2500 100%);
            opacity: 0.1;
            z-index: 0;
        }
        .register-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.4);
            padding: 3.5rem;
            width: 100%;
            max-width: 650px;
            animation: slideUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.2);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .logo-section h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #E65100 0%, #BF360C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }
        .logo-section p {
            color: #666;
            font-size: 1rem;
            font-weight: 500;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #E65100;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }
        .form-control {
            width: 100%;
            padding: 14px 18px 14px 50px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            background: #fafafa;
        }
        .form-control:focus {
            outline: none;
            border-color: #E65100;
            background: white;
            box-shadow: 0 0 0 4px rgba(230, 81, 0, 0.15);
        }
        .row {
            display: flex;
            gap: 1rem;
        }
        .col {
            flex: 1;
        }
        .form-select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            background: #fafafa;
        }
        .form-select:focus {
            outline: none;
            border-color: #E65100;
            background: white;
            box-shadow: 0 0 0 4px rgba(230, 81, 0, 0.15);
        }
        .btn-register {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #E65100 0%, #BF360C 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
        }
        .btn-register::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        .btn-register:hover::before {
            left: 100%;
        }
        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(230, 81, 0, 0.5);
        }
        .btn-register:active {
            transform: translateY(-1px);
        }
        .conductor-section {
            background: linear-gradient(135deg, #fff8f0 0%, #fff 100%);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 2rem;
            animation: fadeIn 0.6s ease-in;
            border: 2px solid rgba(230, 81, 0, 0.2);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .conductor-section h5 {
            color: #E65100;
            margin-bottom: 1.5rem;
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .footer-links {
            text-align: center;
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 2px solid #e0e0e0;
        }
        .footer-links a {
            color: #E65100;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .footer-links a:hover {
            color: #BF360C;
            transform: scale(1.05);
        }
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .back-link a {
            color: #666;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .back-link a:hover {
            color: #E65100;
            transform: translateX(-5px);
        }
        @media (max-width: 768px) {
            .register-container {
                padding: 2.5rem;
                max-height: 95vh;
            }
            .logo-section h1 {
                font-size: 2.5rem;
            }
            .row {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo-section">
            <h1>inDrive</h1>
            <p>Únete a nuestra comunidad</p>
        </div>

        <form th:action="@{/auth/registro}" method="post">
            <div class="row">
                <div class="col form-group">
                    <label for="nombres">Nombres</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="nombres" name="nombres" class="form-control" placeholder="Tu nombre" required>
                    </div>
                </div>
                <div class="col form-group">
                    <label for="apellidos">Apellidos</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="apellidos" name="apellidos" class="form-control" placeholder="Tu apellido" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="correo" name="correo" class="form-control" placeholder="tu@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <div class="input-wrapper">
                    <i class="fas fa-phone"></i>
                    <input type="text" id="telefono" name="telefono" class="form-control" placeholder="+51 999 999 999" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-group">
                <label for="rol">Tipo de Usuario</label>
                <select class="form-select" name="rol" id="rol" onchange="mostrarCampos()">
                    <option value="PASAJERO">
                        <i class="fas fa-user"></i> Pasajero
                    </option>
                    <option value="CONDUCTOR">
                        <i class="fas fa-car"></i> Conductor
                    </option>
                </select>
            </div>

            <div id="datosConductor" style="display: none;">
                <div class="conductor-section">
                    <h5><i class="fas fa-car"></i> Datos del Vehículo</h5>
                    
                    <div class="form-group">
                        <label for="licencia">Número de Licencia</label>
                        <div class="input-wrapper">
                            <i class="fas fa-id-card"></i>
                            <input type="text" id="licencia" name="licencia" class="form-control" placeholder="H-12345678">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col form-group">
                            <label for="marca">Marca</label>
                            <div class="input-wrapper">
                                <i class="fas fa-car-side"></i>
                                <input type="text" id="marca" name="marca" class="form-control" placeholder="Toyota">
                            </div>
                        </div>
                        <div class="col form-group">
                            <label for="modelo">Modelo</label>
                            <div class="input-wrapper">
                                <i class="fas fa-car"></i>
                                <input type="text" id="modelo" name="modelo" class="form-control" placeholder="Corolla">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col form-group">
                            <label for="placa">Placa</label>
                            <div class="input-wrapper">
                                <i class="fas fa-hashtag"></i>
                                <input type="text" id="placa" name="placa" class="form-control" placeholder="ABC-123">
                            </div>
                        </div>
                        <div class="col form-group">
                            <label for="color">Color</label>
                            <div class="input-wrapper">
                                <i class="fas fa-palette"></i>
                                <input type="text" id="color" name="color" class="form-control" placeholder="Blanco">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-register">
                <i class="fas fa-user-plus"></i> Registrarme
            </button>
        </form>

        <div class="footer-links">
            <a href="/auth/login">¿Ya tienes cuenta? Inicia Sesión</a>
        </div>

        <div class="back-link">
            <a href="/">
                <i class="fas fa-arrow-left"></i> Volver al inicio
            </a>
        </div>
    </div>

    <script>
        function mostrarCampos() {
            let rol = document.getElementById("rol").value;
            let datos = document.getElementById("datosConductor");
            
            if (rol === "CONDUCTOR") {
                datos.style.display = "block";
            } else {
                datos.style.display = "none";
            }
        }
        
        mostrarCampos();
    </script>
</body>
</html>
